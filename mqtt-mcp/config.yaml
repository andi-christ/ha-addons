name: MQTT MCP
version: "1.1.0"
slug: mqtt_mcp
description: MCP server for watching, publishing and inspecting the Mosquitto broker from Claude
url: https://github.com/andi-christ/ha-addons/tree/main/mqtt-mcp
arch:
  - amd64
  - aarch64
# Prebuilt by .github/workflows/build.yaml; the Supervisor pulls image:version.
image: ghcr.io/andi-christ/mqtt-mcp-{arch}
init: false
startup: application
boot: auto
# Supervisor API: the mqtt service (broker host and login) and the Mosquitto
# add-on log. manager is needed for /addons/<slug>/logs.
hassio_api: true
hassio_role: manager
services:
  - mqtt:need
# /share: the add-on drops an NGINX location snippet there for the NGINX SSL
# proxy add-on (customize.default = nginx_proxy_default*.conf). /ssl: only
# used when ssl is on and the add-on serves HTTPS itself on a published port.
map:
  - share:rw
  - ssl:ro
ports:
  8087/tcp: null
ports_description:
  8087/tcp: Direct MCP endpoint. Leave unpublished when going through the NGINX proxy
options:
  secret: ""
  shared_secrets: []
  nginx_include: true
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  public_host: mqtt.faikin.au
  mqtt_host: ""
  mqtt_port: 0
  mqtt_user: ""
  mqtt_password: ""
  max_window_seconds: 60
  max_messages: 500
  payload_limit: 2000
schema:
  secret: str?
  shared_secrets:
    - name: str
      secret: password
  nginx_include: bool?
  ssl: bool
  certfile: str
  keyfile: str
  public_host: str?
  mqtt_host: str?
  mqtt_port: int?
  mqtt_user: str?
  mqtt_password: password?
  max_window_seconds: int(5,300)?
  max_messages: int(10,5000)?
  payload_limit: int(100,20000)?
